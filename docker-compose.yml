# Local run: `docker compose up --build`. Production on the VPS uses
# /srv/tiktakdelovi.com/docker-compose.yml, which builds ./src the same way.
# Naming matches the box: compose project + container + image = tiktakdelovi.
name: tiktakdelovi
services:
  app:
    build:
      context: .
      target: production
    image: tiktakdelovi-app:local
    container_name: tiktakdelovi-app
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:${PORT:-80}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-80}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
